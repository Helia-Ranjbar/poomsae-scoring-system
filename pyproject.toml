[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "poomsae-scoring-system"
version = "0.1.0"
description = "Video preprocessing foundation for automated Poomsae Taekwondo scoring"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26,<2",
    "opencv-python-headless>=4.10,<5",
    "tqdm>=4.66,<5",
    "ultralytics-opencv-headless>=8.4.102,<8.5",
    "mediapipe>=0.10.20,<0.11",
    "matplotlib>=3.10,<4",
    "pandas>=2.2,<3",
    "scikit-learn>=1.6,<2",
    "joblib>=1.4,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "ruff>=0.9,<1",
]

[project.scripts]
poomsae-preprocess = "poomsae_scoring.cli:main"
poomsae-isolate = "poomsae_scoring.isolation_cli:main"
poomsae-pose = "poomsae_scoring.pose_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
